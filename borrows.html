<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Phiếu Mượn Sách</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div>
                <h1>Quản lý Phiếu Mượn Sách</h1>
                <p>Quản lý phiếu mượn, sửa, xóa và thống kê nhanh.</p>
            </div>
            <button id="btnAddBorrow" class="primary-btn">Thêm phiếu mượn</button>
        </header>

        <section class="stats-grid">
            <article class="card">
                <h2 id="totalCount">0</h2>
                <p>Tổng số phiếu mượn</p>
            </article>
            <article class="card">
                <h2 id="borrowedCount">0</h2>
                <p>Số phiếu đang mượn</p>
            </article>
            <article class="card">
                <h2 id="returnedCount">0</h2>
                <p>Số phiếu đã trả</p>
            </article>
        </section>

        <section class="table-section">
            <table class="borrow-table">
                <thead>
                    <tr>
                        <th>Mã phiếu</th>
                        <th>Người mượn</th>
                        <th>Mã sách</th>
                        <th>Thể loại</th>
                        <th>Ngày mượn</th>
                        <th>Hạn trả</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="borrowList"></tbody>
            </table>
            <p id="emptyMessage" class="empty-message">Chưa có phiếu mượn nào. Nhấn Thêm phiếu mượn để bắt đầu.</p>
        </section>
    </div>

    <!-- Modal dùng để thêm hoặc sửa phiếu mượn -->
    <div class="modal hidden" id="borrowModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Thêm phiếu mượn</h2>
                <button class="close-btn" id="closeModal" type="button" aria-label="Đóng">×</button>
            </div>
            <form id="borrowForm" novalidate>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="borrowId">Mã phiếu mượn</label>
                        <input type="text" id="borrowId" name="borrowId" placeholder="PM-0001" />
                        <span class="error-message" id="errorBorrowId"></span>
                    </div>
                    <div class="form-group">
                        <label for="borrowerName">Họ tên người mượn</label>
                        <input type="text" id="borrowerName" name="borrowerName" placeholder="Nguyễn Văn A" />
                        <span class="error-message" id="errorBorrowerName"></span>
                    </div>
                    <div class="form-group">
                        <label for="bookCode">Mã sách</label>
                        <input type="text" id="bookCode" name="bookCode" placeholder="BK12345" />
                        <span class="error-message" id="errorBookCode"></span>
                    </div>
                    <div class="form-group">
                        <label for="category">Thể loại sách</label>
                        <select id="category" name="category">
                            <option value="">-- Chọn thể loại --</option>
                            <option value="CNTT">CNTT</option>
                            <option value="Kinh tế">Kinh tế</option>
                            <option value="Ngoại ngữ">Ngoại ngữ</option>
                            <option value="Kỹ năng">Kỹ năng</option>
                        </select>
                        <span class="error-message" id="errorCategory"></span>
                    </div>
                    <div class="form-group">
                        <label for="borrowDate">Ngày mượn</label>
                        <input type="date" id="borrowDate" name="borrowDate" />
                        <span class="error-message" id="errorBorrowDate"></span>
                    </div>
                    <div class="form-group">
                        <label for="dueDate">Hạn trả</label>
                        <input type="date" id="dueDate" name="dueDate" />
                        <span class="error-message" id="errorDueDate"></span>
                    </div>
                    <div class="form-group">
                        <label for="phone">Số điện thoại liên hệ</label>
                        <input type="text" id="phone" name="phone" placeholder="0912345678" />
                        <span class="error-message" id="errorPhone"></span>
                    </div>
                    <div class="form-group">
                        <label for="email">Email liên hệ</label>
                        <input type="email" id="email" name="email" placeholder="abc@library.vn" />
                        <span class="error-message" id="errorEmail"></span>
                    </div>
                    <div class="form-group">
                        <label for="status">Trạng thái mượn</label>
                        <select id="status" name="status">
                            <option value="">-- Chọn trạng thái --</option>
                            <option value="Đang mượn">Đang mượn</option>
                            <option value="Đã trả">Đã trả</option>
                        </select>
                        <span class="error-message" id="errorStatus"></span>
                    </div>
                    <div class="form-group form-group-full">
                        <label for="note">Ghi chú</label>
                        <textarea id="note" name="note" rows="3" placeholder="Ghi chú thêm (tối đa 120 ký tự)"></textarea>
                        <span class="error-message" id="errorNote"></span>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="secondary-btn" id="cancelBtn">Hủy</button>
                    <button type="submit" class="primary-btn">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Thêm file dữ liệu mẫu và logic xử lý của ứng dụng -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
